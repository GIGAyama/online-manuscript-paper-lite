<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#b45309">
  <meta name="color-scheme" content="light">
  <title>インターネットに つながっていません — オンライン原稿用紙 Lite</title>
  <!--
    この画面は「ネットにつながらず、アプリ本体も手元にない」ときに出る。
    だから外部の資産にも JavaScript にも一切頼らない。
    色も文字も自前で持ち、読み込み直しは <a href> で行う
    （インラインの onclick は CSP に引っかかる）。
  -->
  <style>
    :root {
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));
      background: #fdfbf7;
      color: #1e293b;
      font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic UI",
                   "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
      font-size: clamp(15px, 1.6vw + 10px, 18px);
      line-height: 1.8;
      text-align: center;
    }
    @supports not (min-height: 100dvh) { body { min-height: 100vh; } }
    .mark {
      width: 88px; height: 88px; border-radius: 50%;
      background: #fef3c7; border: 4px solid #b45309;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 700; color: #b45309;
    }
    h1 { font-size: clamp(20px, 3vw + 12px, 28px); margin: 0; color: #b45309; }
    p { margin: 0; max-width: 30em; }
    .again {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 52px; min-width: 220px; padding: 12px 28px;
      border-radius: 16px; background: #b45309; color: #fff;
      font-weight: 700; text-decoration: none; font-size: 1.05em;
    }
    .again:focus-visible { outline: 3px solid #1e293b; outline-offset: 3px; }
    .note { color: #475569; font-size: 0.9em; }
    @media (forced-colors: active) {
      .again { border: 2px solid ButtonText; }
      .mark { border: 2px solid CanvasText; }
    }
  </style>
</head>
<body>
  <div class="mark" aria-hidden="true">!</div>
  <h1>いま インターネットに つながっていません</h1>
  <p>でんぱの ある ところで、もういちど ひらいて ください。</p>
  <a class="again" href="./index.html">もういちど ひらく</a>
  <p class="note">
    いちど ひらいた あとなら、つながっていなくても つかえます。<br>
    かいた ぶんしょうは この たんまつの なかに のこっています。
  </p>
</body>
</html>
