<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ブラウザだけで動く縦書き原稿用紙アプリ。入力すると縦書きでリアルタイムにプレビューされ、A4横向きで印刷できます。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GIGA school">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="オンライン原稿用紙 Lite">
  <meta property="og:description" content="ブラウザだけで動く縦書き原稿用紙アプリ。入力すると縦書きでリアルタイムにプレビューされ、A4横向きで印刷できます。">
  <meta property="og:url" content="https://online-manuscript-paper-lite.giga-school.com/">
  <meta property="og:image" content="https://giga-school.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="GIGA school｜学校で使える Web アプリ">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#b45309">
  <meta name="color-scheme" content="light">
  <title>オンライン原稿用紙 Lite</title>

  <!--
    Content Security Policy。

    ・実行コードはすべて自分側（'self'）に置いてある。CDN は学校のフィルタリングで
      塞がれることがあり、1本届かないだけで画面が真っ白になるため使わない。
    ・'unsafe-inline' は style-src にだけ付いている。React と SweetAlert2 が
      style 属性を書くため外せない。script-src には付けない。
    ・file: を並べてあるのは、先生がファイルをそのまま配って開く使い方
      （README にある通り）を残すため。https で配信するときには何も増やさない。
    ・frame-ancestors は <meta> では無視される（コンソールに警告が出るだけ）。
      他サイトへの埋め込みを止めるには HTTP ヘッダーが必要で、GitHub Pages では
      足せない。独自ドメインや CDN を前に置くときは、そちらで設定すること。
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' file:;
    script-src 'self' file:;
    style-src 'self' file: 'unsafe-inline';
    font-src 'self' file:;
    img-src 'self' file: data: blob:;
    connect-src 'self' file:;
    worker-src 'self' file:;
    manifest-src 'self' file:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">

  <!--
    インストールの合図をいちばん先に受け取る。
    Chrome は条件が揃うと即座に beforeinstallprompt を出すため、React などの
    読み込みより後だと合図を取りこぼし、通信の遅い端末で「インストール」ボタンが
    出なくなる。CSP に 'unsafe-inline' を足さずに済むよう、インラインではなく
    小さな外部ファイルにして同期読み込みする。
  -->
  <script src="./install-hook.js"></script>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./favicon.png">
  <!--
    apple-touch-icon には透明を含む画像を指さない。
    iOS は透明部分を黒で埋めるため、ホーム画面でアイコンの四隅だけが黒く出る。
    icons/apple-touch-icon.png は下地を端まで塗った専用画像（180×180）。
  -->
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="原稿用紙Lite">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!--
    Google Fonts。届かなくても字の形が変わるだけで動作に影響しないため、
    CDN のままにしてある（自己ホストすると日本語フォントは数MBになり、
    校内 Wi-Fi で40人が同時に開くいちばん避けたい状況を自分で作る）。
    端末側の日本語フォントを必ず後ろに並べてある（tailwind.config.js を見ること）。
  -->
  <!-- 書体は自分のところから配る（生成物。node tools/fonts/build-fonts.mjs で作り直す）。
       ここに Google Fonts への link を戻さないこと。学校のフィルタが
       塞ぐと書体が当たらず、塞ぎ方によっては画面そのものが出ない。 -->
  <link rel="stylesheet" href="./fonts.css" />

  <link rel="stylesheet" href="./css/style.css">

  <!-- 実行コードはすべて自分側に置く。ビルド済みなのでブラウザは翻訳しない -->
  <script defer src="./vendor/react.js"></script>
  <script defer src="./vendor/react-dom.js"></script>
  <script defer src="./vendor/sweetalert2.js"></script>
  <script defer src="./js/icons.js"></script>
  <script defer src="./js/app.js"></script>

  <!-- 利用規約・プライバシーへの行き先。中身は正本の部品
       standards/web/giga-app-links.js（配布物 web/giga-app-links.js）が、
       src/app.jsx のフッターに置いた <span data-giga-links> の中に出す。
       data-links は置き場所の側に書いてある。 -->
  <script defer src="./web/giga-app-links.js"></script>
</head>
<body class="selection:bg-amber-200 bg-amber-50/40 text-slate-800 overflow-hidden print:overflow-visible">
  <div id="root">
    <div class="boot-screen">
      <div class="boot-spinner"></div>
      <div>よみこみちゅう…</div>
    </div>
  </div>
  <noscript>
    <p style="padding:24px;font-weight:bold;color:#b45309;">
      このアプリを使うには JavaScript を有効にしてください。
    </p>
  </noscript>
</body>
</html>
